<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Book/Policy icon -->
  <rect x="30" y="25" width="25" height="35" fill="#ffffff" rx="2"/>
  <rect x="45" y="25" width="25" height="35" fill="#ffffff" rx="2"/>
  
  <!-- Pulse/Wave lines -->
  <path d="M20 70 Q30 60, 40 70 T60 70 T80 70" stroke="#ffffff" stroke-width="3" fill="none"/>
  <path d="M25 75 Q35 65, 45 75 T65 75 T85 75" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>
  
  <!-- Small dot for pulse -->
  <circle cx="50" cy="70" r="3" fill="#ffffff"/>
</svg>